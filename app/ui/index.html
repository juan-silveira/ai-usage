<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IA Usage</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Uso das IAs</h1>
      <button id="refresh" title="Atualizar agora">↻</button>
    </header>
    <nav id="tabs" role="tablist" aria-label="Provedores"></nav>
    <h2 class="section">Sessões</h2>
    <section id="sessions"><p class="muted">Nenhuma sessão ativa.</p></section>
    <h2 class="section">Limites</h2>
    <main id="providers"><p class="muted">Carregando…</p></main>
    <h2 class="section">Preferências</h2>
    <section class="card prefs">
      <label class="pref">
        <span>Texto na barra do sistema</span>
        <select id="bar-format">
          <option value="peak">Maior uso (17%)</option>
          <option value="session">Sessão 5h (5%)</option>
          <option value="session_weekly">Sessão e semanal (5/17%)</option>
          <option value="off">Só o ícone do app</option>
        </select>
      </label>
      <label class="pref">
        <span>Mostrar fim da janela</span>
        <select id="bar-reset">
          <option value="off">Não</option>
          <option value="remaining">Tempo restante (3h46)</option>
          <option value="clock">Horário (12:40)</option>
        </select>
      </label>
      <div id="provider-bar"></div>
      <label class="pref">
        <span>Alertar ao passar de (%)</span>
        <input type="text" id="thresholds" inputmode="numeric" placeholder="80, 95" />
      </label>
      <div class="pref">
        <label><input type="checkbox" id="sound-needs-input" /> Som quando precisa de você</label>
        <button class="small" data-preview="needs_input" title="Ouvir">▶</button>
      </div>
      <div class="pref">
        <label><input type="checkbox" id="sound-done" /> Som quando conclui</label>
        <button class="small" data-preview="done" title="Ouvir">▶</button>
      </div>
      <div class="pref">
        <label><input type="checkbox" id="sound-threshold" /> Som ao passar de uma faixa</label>
        <button class="small" data-preview="threshold" title="Ouvir">▶</button>
      </div>
    </section>
    <footer id="updated" class="muted"></footer>
    <script src="main.js"></script>
  </body>
</html>
