<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Usage</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 data-i18n="app.heading"></h1>
      <button id="refresh" data-i18n-title="app.refresh">↻</button>
    </header>
    <nav id="tabs" role="tablist" data-i18n-aria-label="tabs.label"></nav>
    <div id="mute-banner" hidden>
      <span id="mute-text"></span>
      <button id="mute-off" class="text" data-i18n="focus.unmute"></button>
    </div>
    <div id="update-banner" hidden>
      <span id="update-text"></span>
      <button id="update-open" class="text" data-i18n="update.install"></button>
    </div>
    <div id="view-usage">
    <h2 class="section" data-i18n="section.sessions"></h2>
    <section id="sessions" class="grid"><p class="muted" data-i18n="sessions.none"></p></section>
    <h2 class="section" data-i18n="section.limits"></h2>
    <main id="providers" class="grid"><p class="muted" data-i18n="app.loading"></p></main>
    <footer id="updated" class="muted"></footer>
    </div>
    <div id="view-settings" hidden>
    <div class="group">
    <h2 class="section" data-i18n="section.connections"></h2>
    <section class="card prefs" id="connections"><p class="muted" data-i18n="app.loading"></p></section>
    </div>
    <div class="group">
    <h2 class="section" data-i18n="section.general"></h2>
    <section class="card prefs">
      <div class="pref">
        <label><input type="checkbox" id="autostart" /> <span data-i18n="general.autostart"></span></label>
      </div>
      <label class="pref">
        <span data-i18n="general.language"></span>
        <select id="language"></select>
      </label>
      <label class="pref">
        <span data-i18n="general.theme"></span>
        <select id="theme">
          <option value="system" data-i18n="theme.system"></option>
          <option value="light" data-i18n="theme.light"></option>
          <option value="dark" data-i18n="theme.dark"></option>
        </select>
      </label>
    </section>
    </div>
    <div class="group">
    <h2 class="section" data-i18n="section.polling"></h2>
    <section class="card prefs">
      <label class="pref">
        <span data-i18n="polling.every"></span>
        <select id="poll-minutes">
          <option value="1"></option>
          <option value="2"></option>
          <option value="5"></option>
          <option value="10"></option>
          <option value="15"></option>
        </select>
      </label>
      <p class="muted" data-i18n="polling.note"></p>
    </section>
    </div>
    <div class="group">
    <h2 class="section" data-i18n="section.bar"></h2>
    <section class="card prefs">
      <label class="pref">
        <span data-i18n="bar.text"></span>
        <select id="bar-format">
          <option value="peak" data-i18n="bar.format.peak"></option>
          <option value="session" data-i18n="bar.format.session"></option>
          <option value="session_weekly" data-i18n="bar.format.session_weekly"></option>
          <option value="off" data-i18n="bar.format.off"></option>
        </select>
      </label>
      <label class="pref">
        <span data-i18n="bar.reset"></span>
        <select id="bar-reset">
          <option value="off" data-i18n="bar.reset.off"></option>
          <option value="remaining" data-i18n="bar.reset.remaining"></option>
          <option value="clock" data-i18n="bar.reset.clock"></option>
        </select>
      </label>
      <div id="provider-bar"></div>

    </section>
    </div>
    <div class="group">
    <h2 class="section" data-i18n="section.alerts"></h2>
    <section class="card prefs">
      <label class="pref">
        <span data-i18n="focus.label"></span>
        <select id="mute">
          <option value="off" data-i18n="focus.off"></option>
          <option value="30"></option>
          <option value="60"></option>
          <option value="120"></option>
          <option value="tomorrow" data-i18n="focus.tomorrow"></option>
          <option value="always" data-i18n="focus.always"></option>
        </select>
      </label>
      <p class="muted" id="mute-status" hidden></p>
      <label class="pref">
        <span data-i18n="alerts.session"></span>
        <input type="text" class="levels" data-window="session" inputmode="numeric" placeholder="80, 95" />
      </label>
      <label class="pref">
        <span data-i18n="alerts.weekly"></span>
        <input type="text" class="levels" data-window="weekly" inputmode="numeric" placeholder="80, 95" />
      </label>
      <p class="muted" data-i18n="alerts.note"></p>
      <div class="pref">
        <label><input type="checkbox" id="sound-needs-input" /> <span data-i18n="alerts.sound_needs_input"></span></label>
        <span class="row-inline">
          <select class="tone" data-sound="needs_input"></select>
          <button class="small" data-preview="needs_input" data-i18n-title="alerts.listen">▶</button>
        </span>
      </div>
      <div class="pref">
        <label><input type="checkbox" id="sound-done" /> <span data-i18n="alerts.sound_done"></span></label>
        <span class="row-inline">
          <select class="tone" data-sound="done"></select>
          <button class="small" data-preview="done" data-i18n-title="alerts.listen">▶</button>
        </span>
      </div>
      <div class="pref">
        <label><input type="checkbox" id="sound-threshold" /> <span data-i18n="alerts.sound_threshold"></span></label>
        <span class="row-inline">
          <select class="tone" data-sound="threshold"></select>
          <button class="small" data-preview="threshold" data-i18n-title="alerts.listen">▶</button>
        </span>
      </div>
      <label class="pref">
        <span data-i18n="alerts.volume"></span>
        <input type="range" id="sound-volume" min="0" max="100" step="5" />
      </label>
    </section>
    </div>
    <div class="group">
    <h2 class="section" data-i18n="section.widget"></h2>
    <section class="card prefs">
      <div class="pref">
        <label><input type="checkbox" id="widget-enabled" /> <span data-i18n="widget.enabled"></span></label>
        <button id="widget-move" class="text"></button>
      </div>
      <div class="pref wrap">
        <span data-i18n="widget.providers"></span>
        <span class="row-inline" id="widget-providers"></span>
      </div>
      <label class="pref">
        <span data-i18n="widget.sessions"></span>
        <select id="widget-sessions">
          <option value="summary" data-i18n="widget.sessions.summary"></option>
          <option value="list" data-i18n="widget.sessions.list"></option>
          <option value="hidden" data-i18n="widget.sessions.hidden"></option>
        </select>
      </label>
      <div class="pref">
        <span data-i18n="widget.color"></span>
        <span class="row-inline">
          <input type="color" id="widget-color" data-i18n-title="widget.color_pick" />
          <button id="widget-color-reset" class="text" data-i18n="widget.color_reset"></button>
        </span>
      </div>
      <label class="pref">
        <span data-i18n="widget.opacity"></span>
        <input type="range" id="widget-opacity" min="0" max="100" step="5" />
      </label>
      <p class="muted" data-i18n="widget.note"></p>
    </section>
    </div>
    <div class="group">
    <h2 class="section" data-i18n="section.api"></h2>
    <section class="card prefs">
      <div class="pref">
        <label><input type="checkbox" id="api-enabled" /> <span data-i18n="api.enabled"></span></label>
        <input type="text" id="api-port" inputmode="numeric" maxlength="5" class="port" data-i18n-title="api.port" />
      </div>
      <p class="muted" id="api-info"></p>
    </section>
    </div>
    <div class="group">
    <h2 class="section" data-i18n="section.updates"></h2>
    <section class="card prefs">
      <div class="pref">
        <label><input type="checkbox" id="check-updates" /> <span data-i18n="updates.check"></span></label>
        <button id="check-now" class="text" data-i18n="updates.check_now"></button>
      </div>
      <p class="muted" id="update-status"></p>
    </section>
    </div>
    </div>
    <script src="i18n.js" data-main="main.js"></script>
  </body>
</html>
